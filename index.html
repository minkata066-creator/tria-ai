<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1"><title>TRIA AI</title>
<style>
*{box-sizing:border-box}
body,.b,#ch,.hd{display:flex;gap:6px}
body,#ch{flex-direction:column}
body,input,textarea,#ch{padding:10px}
body{margin:0;background:#0b0f19;color:#e2e8f0;font:16px sans-serif;height:100dvh}
.hd{align-items:center;justify-content:space-between}
h1{font-size:1.05rem;margin:0;color:#38bdf8}
.sb-grp{display:flex;gap:4px}
.sub{background:#1e293b;color:#94a3b8;font-size:.75rem;padding:4px 9px;font-weight:600}
input,textarea,button,canvas,#ch,.u,.a{border-radius:10px}
input,textarea,.a{background:#1e293b}
input,textarea{flex:1;border:1px solid #334155;font-size:16px;color:#fff;font-family:inherit}
textarea{resize:none;height:42px;max-height:120px;line-height:20px;overflow-y:auto}
button,.u{background:#0284c7;color:#fff}
button{padding:0 14px;border:0;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
canvas,#ch{background:#111827}
canvas{border:1px solid #1e293b;width:100%;height:110px;flex-shrink:0}
#ch{flex:1;overflow-y:auto;font-size:.9rem}
.u,.a{padding:8px 12px;white-space:pre-wrap;max-width:85%;word-break:break-word}
.u{align-self:flex-end}.a{align-self:flex-start}
.m{font-size:.7rem;color:#f472b6;margin-bottom:3px}
</style>
<div class=hd>
  <h1>TRIA AI // 波動共鳴</h1>
  <div class=sb-grp>
    <button type=button class=sub id=kbBtn>キー</button>
    <button type=button class=sub id=clrBtn>クリア</button>
  </div>
</div>
<div class=b id=kb><input type=password id=ki placeholder="APIキー(AIzaSy...)"><button type=button id=sb>セット</button></div>
<canvas id=c width=600 height=110></canvas>
<div id=ch></div>
<div class=b><textarea id=ip placeholder="メッセージ..." rows=1></textarea><button type=button id=bt>送信</button></div>
<script>
const c=document.getElementById('c'),cx=c.getContext('2d'),
  kb=document.getElementById('kb'),ki=document.getElementById('ki'),sb=document.getElementById('sb'),
  ch=document.getElementById('ch'),ip=document.getElementById('ip'),bt=document.getElementById('bt'),
  kbBtn=document.getElementById('kbBtn'),clrBtn=document.getElementById('clrBtn');

let k=localStorage.k||'',t=0,H=[],last=0,
  esc=s=>s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),
  add=(cls,html)=>{let d=document.createElement('div');d.className=cls;d.innerHTML=html;ch.appendChild(d);ch.scrollTop=ch.scrollHeight;return d},
  W=[[.22,4.5,.4,'#38bdf8'],[.2,6.2,.5,'#818cf8'],[.25,3.14,.25,'#f472b6']].map(([e,w,d,col])=>[e,w,d,col,[],Array(140).fill(e)]),
  I=(i,a)=>{W[i][4].push([a,t]);if(W[i][4].length>9)W[i][4].shift()},
  M=['gemini-3.8-flash','gemini-3.5-flash-lite','gemini-3.1-flash-lite'];

function setK(v,init=false){
  v=v.trim();
  if(!v)return !init&&alert('APIキーを入力してください');
  k=v;localStorage.k=k;ki.value='';kb.style.display='none';
  if(!init)add('a','<div class=m>準備完了</div>メッセージをどうぞ！');
}

if(k){
  setK(k,true);
  add('a','<div class=m>基線 ε = 0.20 / 準備完了</div>メッセージをどうぞ！');
}else{
  add('a','<div class=m>基線 ε = 0.20</div>APIキーを入れてセット');
}

sb.onclick=()=>setK(ki.value);
ki.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();setK(ki.value)}};
kbBtn.onclick=()=>{
  let show=kb.style.display==='none';
  kb.style.display=show?'flex':'none';
  if(show)ki.focus();
};
clrBtn.onclick=()=>{
  H.length=0;ch.innerHTML='';
  add('a','<div class=m>基線 ε = 0.20 / リセット</div>会話をリセットしたよ！');
};

async function ask(sys,S){
  let err;
  for(let idx=0;idx<M.length;idx++){
    let m=M[idx];
    for(let i=0;i<2;i++){
      try{
        let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(k),{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          signal:AbortSignal.timeout(20e3),
          body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:H,generationConfig:{temperature:1.15}})
        });
        let d=await r.json().catch(()=>({})),msg=d.error?.message||'HTTP '+r.status;
        if(r.ok&&!d.error){
          let rep=(d.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought&&p.text).map(p=>p.text).join('\n');
          if(!rep)throw Error('応答が空 ('+(d.candidates?.[0]?.finishReason||'UNKNOWN')+')');
          return{rep,m};
        }
        err=Error(msg);
        if(r.status===403||(r.status===400&&/api.?key|permission|unauthorized/i.test(msg))){
          delete localStorage.k;k='';kb.style.display='flex';
          throw err;
        }
        if(r.status===404){
          if(M.length>1){M.splice(idx,1);idx--}
          S(`切替中 (${m})...`);
          break;
        }
        if(r.status===503||r.status===429||/high demand|overloaded/i.test(msg)){
          if(i<1){S(`再同調中 (${m})...`);await new Promise(ok=>setTimeout(ok,800));continue}
          S(`切替中 (${m})...`);
          break;
        }
        S(`切替中 (${m})...`);
        break;
      }catch(e){
        if(e.name==='TimeoutError'||e.name==='AbortError'||e instanceof TypeError){
          err=Error(e instanceof TypeError?'通信エラー':'タイムアウト');
          if(i<1){S(`再試行中 (${m})...`);continue}
          S(`切替中 (${m})...`);
          break;
        }
        throw e;
      }
    }
  }
  throw err||Error('利用可能なモデルがありません');
}

async function send(){
  let txt=ip.value.trim();
  if(!txt||bt.disabled)return;
  if(!k){kb.style.display='flex';ki.focus();return alert('APIキーをセットしてください')}
  add('u',esc(txt));
  ip.value='';ip.style.height='42px';bt.disabled=true;
  let cs=[...txt].reduce((a,ch)=>a+ch.charCodeAt(0),0),
    amp=Math.min(1.4,.5+txt.length*.06),
    om=+(3+cs%50*.1).toFixed(2),
    en=Math.round(amp*100),
    ld=add('a',''),
    S=(x,meta=`共鳴中... E:${en} / ω:${om}`)=>ld.innerHTML=`<div class=m>${meta}</div>${x}`;
  S('通信中...');
  W[0][1]=om;I(0,amp);
  H.push({role:'user',parts:[{text:txt}]});
  try{
    let{rep,m}=await ask(`あなたはユーザーの気心の知れた仲良い知的な相棒「ワトソン」です。敬語は使わず、親しい友人やバディのような自然なタメ口で話してください。前の文脈を踏まえ、観察眼や独自の視点を交えながら話を広げたり掘り下げたりして、3〜5文くらいの読み応えのある長めの文章で会話してください。同じ挨拶や定型文の繰り返しは避け、数値(E:${en},ω:${om})は口に出さず、今の波長(${en>=110?'テンション高めでノリよく面白い発想を飛ばしながら':om>=5.5?'鋭い考察や別の切り口も交えつつ':'リラックスしてじっくり語り合うように'})を雰囲気に込めてください。`,S);
    H.push({role:'model',parts:[{text:rep}]});
    while(H.length>20)H.splice(0,2);
    W[1][1]=4+rep.length%40*.1;
    I(1,Math.min(1.3,.5+rep.length*.005));
    setTimeout(()=>I(2,amp*1.15),250);
    S(esc(rep),`E:${en} / ω:${om} [${m}]`);
  }catch(e){
    H.pop();
    S(esc(e.message),'<span style=color:#ef4444>エラー詳細</span>');
  }finally{
    bt.disabled=false;
    if(!matchMedia('(pointer:coarse)').matches)ip.focus();
  }
}

bt.onclick=send;
ip.oninput=()=>{ip.style.height='42px';ip.style.height=Math.min(ip.scrollHeight,120)+'px'};
ip.onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}};

function D(now){
  if(now-last>=33){
    last=now;
    let dpr=Math.min(window.devicePixelRatio||1,2),cw=c.clientWidth||600,chh=110;
    if(c.width!==Math.round(cw*dpr)||c.height!==Math.round(chh*dpr)){
      c.width=Math.round(cw*dpr);c.height=Math.round(chh*dpr);
    }
    cx.setTransform(dpr,0,0,dpr,0,0);
    cx.clearRect(0,0,cw,chh);
    [[98,'#334155',[4,4]],[89,'#94a3b840',[]]].forEach(([y,col,dash])=>{
      cx.strokeStyle=col;cx.lineWidth=1;cx.setLineDash(dash);
      cx.beginPath();cx.moveTo(0,y);cx.lineTo(cw,y);cx.stroke();
    });
    W.forEach(([e,w,d,col,p,h])=>{
      let v=e+.03*Math.sin(w*.5*t);
      for(let i=0;i<p.length;i++)v+=p[i][0]*Math.sin(w*(t-p[i][1]))*Math.exp(-d*(t-p[i][1]));
      h.push(Math.max(.05,v));h.shift();
      cx.strokeStyle=col;cx.lineWidth=2.5;cx.beginPath();
      for(let i=0;i<h.length;i++)cx.lineTo(i/139*cw,98-h[i]*45);
      cx.stroke();
    });
    t+=.06;
  }
  requestAnimationFrame(D);
}
I(2,.7);
requestAnimationFrame(D);
</script>
