<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TRIA AI</title>
<style>
body{margin:0;background:#0b0f19;color:#e2e8f0;font-family:sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;padding:10px;box-sizing:border-box}
h1{font-size:1.1rem;text-align:center;margin:0 0 6px;color:#38bdf8}
.bar{display:flex;gap:6px;margin-bottom:6px}
input{flex:1;padding:10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:16px}
button{padding:0 14px;border-radius:8px;border:none;background:#0284c7;color:#fff;font-weight:bold}
canvas{background:#111827;border:1px solid #1e293b;border-radius:10px;width:100%;height:110px;flex-shrink:0}
#chat{flex:1;overflow-y:auto;margin:8px 0;padding:10px;background:#111827;border-radius:10px;display:flex;flex-direction:column;gap:8px;font-size:0.9rem}
.u{align-self:flex-end;background:#0284c7;padding:8px 12px;border-radius:12px;max-width:80%;white-space:pre-wrap}
.a{align-self:flex-start;background:#1e293b;padding:8px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap}
.m{font-size:0.7rem;color:#f472b6;margin-bottom:3px}
</style>
</head>
<body>
<h1>TRIA AI // 波動共鳴</h1>
<div class="bar" id="kb"><input type="password" id="ki" placeholder="APIキー(AIzaSy...)を貼付"><button id="sb">セット</button></div>
<canvas id="c" width="600" height="110"></canvas>
<div id="chat"><div class="a"><div class="m">基線 ε = 0.20</div>APIキーを入れて「セット」を押してください。</div></div>
<div class="bar"><input id="in" placeholder="メッセージ..."><button id="btn">送信</button></div>
<script>
let key="",t=0;
const cv=document.getElementById('c'),cx=cv.getContext('2d'),ch=document.getElementById('chat'),inp=document.getElementById('in'),btn=document.getElementById('btn');
document.getElementById('sb').onclick=()=>{key=document.getElementById('ki').value.trim();if(key){document.getElementById('kb').style.display='none';add('a','<div class="m">準備完了</div>メッセージをどうぞ！');}};
class W{
  constructor(e,w,d,c){this.e=e;this.w=w;this.d=d;this.c=c;this.p=[];this.h=Array(140).fill(e);}
  imp(a){this.p.push({a,t0:t});if(this.p.length>10)this.p.shift();}
  up(){
    let v=this.e+0.03*Math.sin(this.w*0.5*t);
    this.p.forEach(p=>{let dt=t-p.t0;if(dt>=0)v+=p.a*Math.sin(this.w*dt)*Math.exp(-this.d*dt);});
    v=Math.max(0.05,v);this.h.push(v);this.h.shift();
  }
}
const w1=new W(0.22,4.5,0.4,'#38bdf8'),w2=new W(0.20,6.2,0.5,'#818cf8'),w3=new W(0.25,3.14,0.25,'#f472b6');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function add(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;ch.appendChild(d);ch.scrollTop=ch.scrollHeight;return d;}
async function send(){
  const txt=inp.value.trim();if(!txt)return;
  if(!key){alert('APIキーをセットしてください');return;}
  add('u',esc(txt));inp.value='';inp.blur();btn.disabled=true;
  let cs=0;for(let i=0;i<txt.length;i++)cs+=txt.charCodeAt(i);
  const amp=Math.min(1.4,0.5+txt.length*0.06),om=parseFloat((3+(cs%50)*0.1).toFixed(2)),en=Math.round(amp*100);
  w1.w=om;w1.imp(amp);
  const ld=add('a','<div class="m">共鳴中... E:'+en+' / ω:'+om+'</div>通信中...');
  const prompt="あなたはTRIA(三点波動共鳴システム)の知性ワトソンです。現在エネルギー:"+en+"、周波数ω:"+om+"。"+(en>=110?"創造的でワクワクする視点で":om>=5.5?"論理的で鋭く整理して":"穏やかに寄り添って")+"、次の言葉に親しみやすく答えてください：\n"+txt;
  try{
    const url="https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key="+encodeURIComponent(key);
    const r=await fetch(url,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        contents:[{parts:[{text:prompt}]}],
        generationConfig:{thinkingConfig:{thinkingLevel:"low"}}
      })
    });
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error?d.error.message:"HTTP "+r.status);
    const parts=d.candidates?.[0]?.content?.parts||[];
    const rep=parts.filter(p=>!p.thought&&p.text).map(p=>p.text).join('\n');
    if(!rep)throw new Error("応答が空でした");
    w2.w=4+(rep.length%40)*0.1;w2.imp(Math.min(1.3,0.5+rep.length*0.005));
    setTimeout(()=>w3.imp(amp*1.15),250);
    ld.innerHTML='<div class="m">E:'+en+' / ω:'+om+'</div>'+esc(rep);
  }catch(e){
    ld.innerHTML='<div class="m" style="color:#ef4444">エラー詳細</div>'+esc(e.message);
  }
  btn.disabled=false;
}
btn.onclick=send;
function draw(){
  cx.clearRect(0,0,600,110);const zy=98,sy=45,by=zy-0.22*sy;
  cx.strokeStyle='#334155';cx.setLineDash([4,4]);cx.beginPath();cx.moveTo(0,zy);cx.lineTo(600,zy);cx.stroke();
  cx.strokeStyle='rgba(148,163,184,0.25)';cx.setLineDash([]);cx.beginPath();cx.moveTo(0,by);cx.lineTo(600,by);cx.stroke();
  [w1,w2,w3].forEach(w=>{
    w.up();cx.strokeStyle=w.c;cx.lineWidth=2.5;cx.beginPath();
    w.h.forEach((v,i)=>{let x=(i/139)*600,y=zy-v*sy;i===0?cx.moveTo(x,y):cx.lineTo(x,y);});
    cx.stroke();
  });
  t+=0.04;requestAnimationFrame(draw);
}
w3.imp(0.7);draw();
</script>
</body>
</html>
