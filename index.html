<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRIA 根幹テスト</title>
</head>
<body style="background:#0b0f19;color:#fff;font-family:sans-serif;padding:16px">

<h3>1. APIキーを貼る</h3>
<input id="key" type="password" placeholder="AIzaSy..." style="width:100%;padding:10px;font-size:16px">

<h3>2. 言葉を送信する</h3>
<input id="msg" type="text" placeholder="こんにちは" style="width:70%;padding:10px;font-size:16px">
<button onclick="send()" style="padding:10px 16px;font-size:16px">送信</button>

<h3>3. AIからの返信</h3>
<pre id="out" style="background:#1e293b;padding:12px;white-space:pre-wrap;min-height:80px">ここに返信が出ます</pre>

<script>
async function send() {
  const k = document.getElementById('key').value.trim();
  const m = document.getElementById('msg').value.trim();
  const out = document.getElementById('out');
  if (!k || !m) { out.textContent = 'キーと言葉を入れてね'; return; }
  out.textContent = '通信中...';
  try {
    const res = await fetch('https://googleapis.com' + k, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: new Array({ parts: new Array({ text: m }) }) })
    });
    const data = await res.json();
    if (data.error) { out.textContent = 'エラー: ' + data.error.message; return; }
    out.textContent = data.candidates.slice(0,1).shift().content.parts.slice(0,1).shift().text;
  } catch (e) {
    out.textContent = '通信失敗: ' + e.message;
  }
}
</script>
</body>
</html>
