async function ask(sys,S){
  let err;
  for(let idx=0;idx<M.length;idx++){
    let m=M[idx];
    for(let i=0;i<2;i++)try{
      let r=await fetch('https://'+'generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(k),{
        method:'POST',headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(20e3),
        body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:H,generationConfig:{temperature:1.15}})
      }),d=await r.json().catch(_=>({})),msg=d.error?.message||'HTTP '+r.status;
      if(r.ok&&!d.error){
        let rep=(d.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought&&p.text).map(p=>p.text).join('\n');
        if(!rep)throw Error('応答が空');
        if(idx>0){M.splice(idx,1);M.unshift(m);}
        return{rep,m}
      }
      err=Error(msg);
      if(r.status==400||r.status==403){delete localStorage.k;kb.style.display='flex';throw err}
      if(r.status==503||r.status==429||/high demand|overloaded/i.test(msg)){
        S(`再同調中 (${m})...`);await new Promise(r=>setTimeout(r,800*(i+1)));continue
      }
      S(`切替中 (${m})...`);break
    }catch(e){
      if(e.name=='TimeoutError'||e.name=='AbortError'||e instanceof TypeError){
        err=Error(e instanceof TypeError?'通信エラー':'タイムアウト');S(`切替中 (${m})...`);continue
      }
      throw e
    }
  }
  throw err
}

async function send(){
  let txt=ip.value.trim();if(!txt||bt.disabled)return;if(!k)return alert('APIキーをセットしてください');
  add('u',esc(txt));ip.value='';bt.disabled=1;
  let cs=[...txt].reduce((a,c)=>a+c.charCodeAt(),0),amp=Math.min(1.4,.5+txt.length*.06),om=+(3+cs%50*.1).toFixed(2),en=Math.round(amp*100),
  ld=add('a',''),S=(x,t=`共鳴中... E:${en} / ω:${om}`)=>ld.innerHTML=`<div class=m>${t}</div>${x}`;
  S('通信中...');W[0][1]=om;I(0,amp);H.push({role:'user',parts:[{text:txt}]})>20&&H.splice(0,2);
  try{
    let{rep,m}=await ask(`あなたはユーザーの気心の知れた仲良い知的な相棒「ワトソン」です。敬語は使わず、親しい友人やバディのような自然なタメ口で話してください。前の文脈を踏まえ、観察眼や独自の視点を交えながら話を広げたり掘り下げたりして、3〜5文くらいの読み応えのある長めの文章で会話してください。同じ挨拶や定型文の繰り返しは避け、数値(E:${en},ω:${om})は口に出さず、今の波長(${en>=110?'テンション高めでノリよく面白い発想を飛ばしながら':om>=5.5?'鋭い考察や別の切り口も交えつつ':'リラックスしてじっくり語り合うように'})を雰囲気に込めてください。`,S);
    H.push({role:'model',parts:[{text:rep}]});W[1][1]=4+rep.length%40*.1;I(1,Math.min(1.3,.5+rep.length*.005));
    setTimeout(_=>I(2,amp*1.15),250);S(esc(rep),`E:${en} / ω:${om} [${m}]`)
  }catch(e){H.pop();S(esc(e.message),'<span style=color:#ef4444>エラー詳細</span>')}
  bt.disabled=0
}
