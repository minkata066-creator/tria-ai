async function ask(sys,st,g,sc){
  let err;
  for(let idx=0;idx<m.length;idx++){
    let md=m[idx];

        let r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+md+':generateContent?key='+encodeURIComponent(k),{
          method:'POST',headers:{'Content-Type':'application/json'},signal:ac.signal,
          body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:h,generationConfig:{temperature:1.15}})
        });
        if(g!==gen)throw 0;
        let d=await r.json().catch(_=>({})),msg=d.error?.message||'HTTP '+r.status;
        if(r.ok&&!d.error){
          let rep=(d.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought&&p.text).map(p=>p.text).join('\n');
          if(!rep)throw Error('応答が空 ('+(d.candidates?.[0]?.finishReason||'UNKNOWN')+')');
          return{rep,md}
        }
        err=Error(msg);
        if(r.status===403||(r.status===400&&/api.?key|permission|unauthorized/i.test(msg))){ls('k',null);k='';K.hidden=0;throw err}
        if(r.status===404){if(m.length>1){m.splice(idx,1);idx--}st(`切替中 (${md})...`);break}
        if((r.status===503||r.status===429||/high demand|overloaded/i.test(msg))&&i<1){
          st(`再同調中 (${md})...`);await new Promise(ok=>setTimeout(ok,800));if(g!==gen)throw 0;continue
        }
        st(`切替中 (${md})...`);break
      }catch(e){
        if(g!==gen)throw 0;
        if(e.name==='AbortError'||e instanceof TypeError){
          err=Error(tf?'タイムアウト':'通信エラー');
          if(i<1){st(`再試行中 (${md})...`);continue}
          st(`切替中 (${md})...`);break
        }
        throw e
      }finally{clearTimeout(to);sc.signal.removeEventListener('abort',onC)}
    }
  }
  throw err||Error('利用可能なモデルがありません')
}
